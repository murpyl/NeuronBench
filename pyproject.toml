[project]
name = "neuronbench"
version = "0.1.0"
description = "Predict the effect of interventions on LLM neurons, graded against measured outcomes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
neuronbench = "neuronbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuronbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
